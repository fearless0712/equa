<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'none'">
<meta name="referrer" content="strict-origin-when-cross-origin">
<title>EQUA司令塔</title>
<meta name="description" content="EQUA司令塔：部署ごとの動きと毎日の定期作業を、公開済みの記録から自動で表示する画面です。">
<meta name="theme-color" content="#05070c">
<link rel="canonical" href="https://equaglobal.com/hq.html">
<link rel="alternate" hreflang="ja" href="https://equaglobal.com/hq.html">
<link rel="alternate" hreflang="en" href="https://equaglobal.com/en/hq.html">
<link rel="alternate" hreflang="x-default" href="https://equaglobal.com/hq.html">
<link rel="icon" type="image/png" href="favicon.png?v=202610210023">
<link rel="stylesheet" href="assets/css/hq.css?v=202611170500">
<script src="assets/js/hq.js?v=202611170500" defer></script>
</head>
<body>
<div class="vp" id="vp">
<div class="stage" id="stage">
<div class="app" id="app">
<header class="hd">
  <div class="hd-brand">
    <div class="brand"><b>EQUA</b> · Command Center</div>
    <div class="org">運営 <em>Eternal Philosophy</em> ＞ <em>EQUA</em> ＞ <em>MisaNeco Works</em></div>
  </div>
  <h1 class="title">EQUA<span>司令塔</span></h1>
  <div class="sp"></div>
  <div class="upd" id="upd" title="データの更新時刻"></div>
  <a class="back" href="index.html">EQUAトップへ</a>
  <div class="live" aria-hidden="true"><i></i>LIVE</div>
  <div class="clock"><div class="t" id="clk">--:--:--</div><div class="d" id="dte">----</div></div>
</header>
<main class="grid">
  <aside class="col-l panel" aria-labelledby="kpiH">
    <div class="ph"><h2 id="kpiH">KPI</h2><span class="r">押すと説明</span></div>
    <div class="kpis" id="kpis"></div>
  </aside>
  <section class="col-c" aria-labelledby="vizH">
    <div class="panel viz">
      <div class="ph"><h2 id="vizH">部署と定期作業 · 24時間</h2><div class="scanlog" id="scanlog" aria-hidden="true"><span class="sh">今日の予定をなぞる</span><ol id="scanrows"></ol></div></div>
      <div class="vizbox" id="vizbox">
        <div class="legend" id="legend" aria-hidden="true"></div>
        <svg id="g" role="group" aria-labelledby="vizH"></svg>
        <canvas id="cv" aria-hidden="true"></canvas>
        <div class="nextbox" id="nextbox"></div>
      </div>
    </div>
    <div class="depts" id="depts"></div>
  </section>
  <aside class="col-r">
    <section class="panel sched" aria-labelledby="schH">
      <div class="ph"><h2 id="schH">今日の定期作業</h2><span class="r" id="schedSum"></span></div>
      <div class="sfilter" id="sfilter" role="toolbar" aria-label="部署で絞りこむ"></div>
      <ol class="slist" id="sched"></ol>
    </section>
    <section class="panel logp" aria-labelledby="logH">
      <div class="ph"><h2 id="logH">作業ログ</h2><span class="r">公開・投稿の記録</span></div>
      <ol class="alog" id="log"></ol>
      <div class="sr" id="live" aria-live="polite"></div>
    </section>
  </aside>
</main>
<footer class="ft">
  <span class="note">数字はすべて公開済みの記録から自動で作っています（お金の数字は載せていません）</span>
  <span class="bar" aria-hidden="true"><i></i></span>
  <span class="op">運営 Eternal Philosophy ＞ EQUA ＞ MisaNeco Works</span>
</footer>
</div>
<div class="scrim" id="scrim" hidden></div>
<div class="drawer" id="drawer" role="dialog" aria-modal="true" aria-labelledby="dwTitle" hidden>
  <div class="dw-hd"><span class="dw-dot" id="dwDot"></span><h2 id="dwTitle"></h2><button type="button" class="dw-x" id="dwClose" aria-label="閉じる">×</button></div>
  <div class="dw-body" id="dwBody"></div>
</div>
</div>
</div>
<noscript><p class="nojs">この画面の表示には JavaScript が必要です。</p></noscript>
</body>
</html>
